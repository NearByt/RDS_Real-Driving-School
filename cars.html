<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Value — RDS</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="home.html"><span class="brand-mark">R</span><span>RDS</span></a><div class="side-label">MENU</div><a class="side-link" href="home.html">⌂ <span>Dashboard</span></a><a class="side-link active" href="cars.html">▣ <span>Car Value</span></a><a class="side-link" href="tyre-codes.html">◉ <span>Tyre Codes</span></a><a class="side-link" href="events.html">◷ <span>Events</span></a><a class="side-link" href="map-guide.html">⌖ <span>Map Guide</span></a><a class="side-link" href="updates.html">✦ <span>RDS Updates</span></a><div class="side-bottom"><span class="guest-pill">GUEST</span></div></aside><main class="main"><header class="top"><div class="searchbox">⌕ <input id="search" placeholder="Search cars..."></div><div class="guest"><div><b>Guest</b><small>PLAYER</small></div><div class="avatar">G</div></div></header><section class="content"><p class="eyebrow">CAR INFORMATION</p><div class="welcome"><div><h1>Vehicle Value</h1><p>Search a vehicle and configure its upgrades.</p></div></div><div class="car-layout"><section><div id="cars" class="car-list"></div></section><section id="calculator" class="calc panel hidden"></section></div></section></main></div><script>
const cars=[{name:"Dodge Challenger SRT Hellcat",stages:[650,730,900,1100,1350,1650,2000],speed:[330,400,445,480,510,535,560],premium:50,police:75,rainbow:10,coating:5},{name:"Nissan GT-R R35",stages:[800,950,1125,1350,1600,1900,2250],speed:[315,365,410,445,475,500,520],premium:50,police:75,rainbow:10,coating:5}];let selected=0;const full=n=>new Intl.NumberFormat("en-IN").format(n);const short=n=>n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(2)+"K":String(n);function render(q=""){document.getElementById("cars").innerHTML=cars.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map((c,i)=>'<button class="car-row '+(i===selected?"chosen":"")+'" onclick="selectCar('+i+')"><div class="car-thumb">RDS</div><div><b>'+c.name+'</b><span>Stage 1–7 · Full specifications</span></div><strong>→</strong></button>').join("")||'<div class="panel">No vehicles found.</div>'}function selectCar(i){selected=i;render(document.getElementById("search").value);openCalc()}function openCalc(){const c=cars[selected],x=document.getElementById("calculator");x.classList.remove("hidden");x.innerHTML='<div class="calc-head"><div><p class="eyebrow">CONFIGURATION</p><h2>'+c.name+'</h2></div><span class="tag">GUEST</span></div><label>Stage <select id="stage">'+c.stages.map((v,i)=>'<option value="'+(i+1)+'">Stage '+(i+1)+'</option>').join("")+'<option value="8">Stage 8+ (approx.)</option></select></label><div class="option-grid"><label><input id="premium" type="checkbox"> Premium <small>includes turbo</small></label><label><input id="police" type="checkbox"> Police</label><label><input id="rainbow" type="checkbox"> Rainbow Smoke</label><label><input id="livery" type="checkbox" onchange="toggleCustom()"> Custom / Livery</label><label><input id="coating" type="checkbox"> Coating</label></div><div id="customWrap" class="hidden"><label>Custom price <input id="custom" placeholder="e.g. 25M, 500K, 1B"></label></div><button class="primary full" onclick="calculate()">Calculate Value →</button><div id="result"></div>'}function toggleCustom(){document.getElementById("customWrap").classList.toggle("hidden",!document.getElementById("livery").checked)}function parseMoney(v){v=(v||"").toUpperCase().replace(/,/g,"").trim();let m=v.match(/^([0-9.]+)([KMBT])?$/);return m?parseFloat(m[1])*({K:1e3,M:1e6,B:1e9,T:1e12}[m[2]]||1):0}function calculate(){const c=cars[selected],s=+document.getElementById("stage").value;let base=c.stages[Math.min(s,7)-1]*1e6;if(s>7)base=Math.round(base*Math.pow(c.stages[6]/c.stages[5],s-7));let adds=[];if(document.getElementById("premium").checked)adds.push(["Premium",c.premium*1e6]);if(document.getElementById("police").checked)adds.push(["Police",c.police*1e6]);if(document.getElementById("rainbow").checked)adds.push(["Rainbow Smoke",c.rainbow*1e6]);if(document.getElementById("livery").checked){let v=parseMoney(document.getElementById("custom").value);if(v)adds.push(["Custom / Livery",v])}if(document.getElementById("coating").checked)adds.push(["Coating",c.coating*1e6]);let total=base+adds.reduce((a,x)=>a+x[1],0),sp=c.speed[Math.min(s,7)-1];document.getElementById("result").innerHTML='<div class="result"><div class="result-total"><small>'+(s>7?"APPROXIMATE VALUE":"ESTIMATED VALUE")+'</small><strong>'+short(total)+'</strong><span>'+full(total)+'</span></div><div class="specs"><div><small>TOP SPEED</small><b>'+sp+' km/h</b><span>'+Math.round(sp*.621371)+' mph</span></div><div><small>STAGE</small><b>'+s+'</b><span>'+(s>7?"Approx.":"Stored data")+'</span></div></div>'+(adds.length?'<div class="adds">'+adds.map(x=>'<div><span>'+x[0]+'</span><b>+'+full(x[1])+'</b></div>').join("")+'</div>':"")+'<p class="note">'+(s>7?"Approximate value — calculated from previous stage data.":"Estimated value from the selected configuration.")+'</p></div>'}document.getElementById("search").oninput=e=>render(e.target.value);render();selectCar(0);
</script></body></html>
