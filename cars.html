<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cars — RDS</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="nav"><a class="logo" href="home.html">RDS<span>.</span></a><a href="home.html">← Hub</a></header><main class="container"><p class="eyebrow">CAR INFO</p><h1>Car Value Calculator</h1><div class="search"><input id="q" placeholder="Search cars..."></div><div id="cars" class="grid"></div><div id="calc" class="panel" style="display:none;margin-top:20px"></div></main><script>
const data=[{name:"Dodge Challenger SRT Hellcat",stages:[500,730,980,1250,1550,1900,2300],speed:[330,400,450,490,525,555,580]}];
const money=n=>n>=1000?(n/1000).toFixed(2)+"B":n+"M";
function draw(q=""){const box=document.getElementById("cars");box.innerHTML=data.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map((c,i)=>'<button class="card" style="text-align:left;color:inherit" onclick="openCalc('+i+')"><span>CAR 01</span><h2>'+c.name+'</h2><p>Stages 1-7 · View specifications</p></button>').join("")||'<div class="panel">No cars found.</div>'}
function openCalc(i){const c=data[i],x=document.getElementById("calc");x.style.display="block";x.innerHTML='<h2>'+c.name+'</h2><p>Premium includes turbo.</p><label>Stage <select id="stage">'+c.stages.map((v,j)=>'<option value="'+(j+1)+'">'+(j+1)+'</option>').join("")+'<option value="8">8+ (approx.)</option></select></label><p><label><input id="premium" type="checkbox"> Premium</label> <label><input id="police" type="checkbox"> Police</label> <label><input id="rainbow" type="checkbox"> Rainbow smoke</label> <label><input id="coat" type="checkbox"> Coating</label></p><button class="btn" onclick="calculate('+i+')">Calculate →</button><div id="result"></div>'}
function calculate(i){const c=data[i],s=+document.getElementById("stage").value;let v=c.stages[Math.min(s,7)-1];if(s>7)v=Math.round(v*Math.pow(c.stages[6]/c.stages[5],s-7));if(document.getElementById("premium").checked)v+=50;if(document.getElementById("police").checked)v+=2;if(document.getElementById("rainbow").checked)v+=15;if(document.getElementById("coat").checked)v+=5;const sp=c.speed[Math.min(s,7)-1];document.getElementById("result").innerHTML='<div class="panel" style="margin-top:18px"><span>'+ (s>7?"APPROXIMATE VALUE":"CALCULATED VALUE")+'</span><h2>'+money(v)+'</h2><p>Stage '+s+' · '+sp+' km/h · '+Math.round(sp*.621371)+' mph</p></div>'}
document.getElementById("q").oninput=e=>draw(e.target.value);draw();
</script></body></html>
