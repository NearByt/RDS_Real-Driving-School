</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="btn menu-toggle" data-menu>☰</button><div class="searchbox">⌕ <input id="globalSearch" placeholder="Search the RDS hub…"></div></div><div class="top-right"><div class="top-chip"><span class="live"></span><b>PUBLIC</b> portal</div><div class="top-chip" data-clock>--:--</div><div class="avatar">G</div></div></header>
<section class="content">
<div class="page-head"><div><p class="eyebrow">VEHICLE LAB</p><h1>Car Value</h1><p>Build a configuration and get a simple value + speed readout.</p></div><div class="actions"><a class="btn" href="home.html">← Dashboard</a></div></div>

<div class="tool-layout">
<section class="panel list-panel reveal" data-reveal>
  <div class="list-search"><input id="carSearch" placeholder="Search cars…"></div>
  <div class="car-list" id="carList"></div>
</section>

<section class="panel calc-panel reveal" data-reveal>
  <div id="calculator"></div>
</section>
</div>
</section></main></div>

<script src="assets/js/app.js"></script>
<script>
const cars=[
 {name:"Dodge Challenger SRT Hellcat",code:"HELLCAT",prices:[650,730,900,1100,1350,1650,2000],speed:[330,400,445,480,510,535,560],premiumPrice:50,police:75,rainbow:10,coating:5},
 {name:"Nissan GT-R R35",code:"GTR-R35",prices:[800,950,1125,1350,1600,1900,2250],speed:[315,365,410,445,475,500,520],premiumPrice:50,police:75,rainbow:10,coating:5}
];
let selected=0,stage=1;
const list=document.getElementById("carList"),calc=document.getElementById("calculator"),search=document.getElementById("carSearch");
function renderCars(){
 const q=search.value.toLowerCase();
 list.innerHTML=cars.map((c,i)=>({...c,i})).filter(c=>c.name.toLowerCase().includes(q)).map(c=>`
 <button class="car-row ${c.i===selected?'chosen':''}" onclick="chooseCar(${c.i})">
   <span class="car-thumb">${c.code}</span><span><b>${c.name}</b><span>Stages 1–7 · supported upgrades</span></span><strong>→</strong>
 </button>`).join("")||'<div style="padding:18px;color:#69716c;font-size:11px">No car matched that search.</div>';
}
function chooseCar(i){selected=i;stage=1;renderCars();renderCalc();}
function money(v){const x=(v||"").toUpperCase().replace(/,/g,"").trim(),m=x.match(/^([0-9]+(?:\.[0-9]+)?)(K|M|B|T)?$/);if(!m)return 0;return parseFloat(m[1])*({K:1e3,M:1e6,B:1e9,T:1e12}[m[2]]||1)}
function stageValue(s){const p=cars[selected].prices;if(s<=7)return p[s-1]*1e6;const ratio=p[6]/p[5];return Math.round(p[6]*1e6*Math.pow(ratio,s-7))}
function stageSpeed(s){const a=cars[selected].speed;if(s<=7)return a[s-1];const ratio=a[6]/a[5];return Math.round(a[6]*Math.pow(ratio,s-7))}
function renderCalc(){
 const c=cars[selected];
 calc.innerHTML=`
  <div class="calc-top"><div><p class="eyebrow">CONFIGURATION</p><h2>${c.name}</h2><p>Premium already includes turbo — there is no separate turbo switch.</p></div><span class="tag">GUEST</span></div>
  <div class="field"><label>SELECT STAGE</label><div class="stage-grid">${[1,2,3,4,5,6,7].map(s=>`<button class="stage-btn ${stage===s?'active':''}" onclick="setStage(${s})">Stage ${s}</button>`).join("")}<button class="stage-btn stage-more ${stage>7?'active':''}" onclick="setStage(8)">Stage 8+ · approximate</button></div></div>
  <div class="option-cards">
   <label class="option"><input id="premium" type="checkbox"><span><b>Premium</b><small>Includes turbo</small></span></label>
   <label class="option"><input id="police" type="checkbox"><span><b>Police</b><small>Vehicle police upgrade</small></span></label>
   <label class="option"><input id="rainbow" type="checkbox"><span><b>Rainbow Smoke</b><small>Cosmetic add-on</small></span></label>
   <label class="option"><input id="coating" type="checkbox"><span><b>Coating</b><small>Cosmetic finish</small></span></label>
  </div>
  <label class="option" style="margin-bottom:16px"><input id="livery" type="checkbox" onchange="toggleLivery()"><span><b>Custom / Livery</b><small>Enter your custom price only when selected.</small></span></label>
  <div id="liveryWrap" class="field hidden"><label>CUSTOM PRICE</label><input id="customPrice" type="text" placeholder="25M · 500K · 1B"></div>
  <button class="primary" style="width:100%" onclick="calculate()">Calculate configuration →</button>
  <div id="result"></div>`;
}
function toggleLivery(){document.getElementById("liveryWrap").classList.toggle("hidden",!document.getElementById("livery").checked)}
function setStage(s){stage=s;renderCalc()}
function calculate(){
 const c=cars[selected];let base=stageValue(stage),sp=stageSpeed(stage),adds=[];
 if(document.getElementById("premium").checked)adds.push(["Premium · includes turbo",c.premiumPrice*1e6]);
 if(document.getElementById("police").checked)adds.push(["Police",c.police*1e6]);
 if(document.getElementById("rainbow").checked)adds.push(["Rainbow Smoke",c.rainbow*1e6]);
 if(document.getElementById("coating").checked)adds.push(["Coating",c.coating*1e6]);
 if(document.getElementById("livery").checked){const v=money(document.getElementById("customPrice").value);if(v)adds.push(["Custom / Livery",v])}
 const total=base+adds.reduce((a,x)=>a+x[1],0),approx=stage>7;
 document.getElementById("result").innerHTML=`
 <div class="result-box">
  <div class="result-label">${approx?'APPROXIMATE VALUE':'CONFIGURED VALUE'}</div>
  <div class="result-main"><strong>${RDS.money(total)}</strong><span>₹${RDS.inr(total)}</span></div>
  <div class="spec-grid"><div class="spec"><small>TOP SPEED</small><b>${sp} km/h</b></div><div class="spec"><small>MPH</small><b>${Math.round(sp*.621371)} mph</b></div><div class="spec"><small>STAGE</small><b>${stage}${approx?'+':''}</b></div></div>
  ${adds.length?`<div style="margin-top:11px;border-top:1px solid var(--line);padding-top:10px">${adds.map(x=>`<div style="display:flex;justify-content:space-between;padding:5px 0;color:#858e88;font-size:10px"><span>${x[0]}</span><b style="color:#dce1dd">+${RDS.money(x[1])}</b></div>`).join("")}</div>`:''}
  <p class="result-note">${approx?'Stage 8+ is an approximation extrapolated from the previous available stage data.':'Result uses the configured stage and selected add-ons in this page dataset.'}</p>
 </div>`;
}
search.addEventListener("input",renderCars);
renderCars();renderCalc();
</script></body></html>
